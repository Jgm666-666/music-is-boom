<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字冒险小网页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", sans-serif;
    background: #000;
  }

  #bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: background-image 0.6s ease;
    z-index: 0;
  }

  #character {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 80vh;
    max-width: 90vw;
    object-fit: contain;
    z-index: 1;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #character.hidden { opacity: 0; }

  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .spin-vinyl { animation: spin-slow 12s linear infinite; }
  
  .bg-pop-sage {
    background-color: #FFFDF9;
    background-image: 
      radial-gradient(at 95% 5%, rgba(255, 122, 51, 0.14) 0px, transparent 55%),
      radial-gradient(at 5% 95%, rgba(251, 191, 36, 0.14) 0px, transparent 55%);
  }

  #dialog-wrapper {
    position: fixed;
    bottom: 3vh;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 520px;
    z-index: 10;
    cursor: pointer;
    transition: transform 0.1s;
  }
  #dialog-wrapper:active { transform: translateX(-50%) scale(0.99); }

  .dialog-shadow {
    position: absolute;
    inset: 0;
    background-color: #292524;
    border-radius: 12px;
    transform: translate(4px, 4px);
    pointer-events: none;
    z-index: -1;
  }

  .dialog-box {
    position: relative;
    border: 2px solid #292524;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #FFFDF9;
  }

  .dialog-top-stripe {
    height: 6px;
    width: 100%;
    display: flex;
    border-bottom: 2px solid #292524;
    pointer-events: none;
  }
  .stripe-1 { width: 50%; background-color: #FF7A33; }
  .stripe-2 { width: 33.33%; background-color: #fbbf24; }
  .stripe-3 { width: 16.67%; background-color: #14b8a6; }

  .dialog-header {
    padding: 6px 12px;
    background-color: rgba(255, 247, 237, 0.7);
    border-bottom: 2px dashed #d6d3d1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  
  .pop-badge {
    padding: 2px 6px;
    background-color: #FF7A33;
    color: white;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    border-radius: 4px;
    border: 1px solid #292524;
    box-shadow: 1px 1px 0px #292524;
  }
  
  .speaker-name {
    font-size: 10px;
    font-weight: bold;
    color: #78716c;
    letter-spacing: 1px;
    font-family: monospace;
  }

  .vinyl-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: #292524;
    border: 1px solid #57534e;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .vinyl-center {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #FF7A33;
    border: 1px solid #fde68a;
  }

  .dialog-text-area {
    padding: 12px 16px;
    color: #292524;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0.5px;
    font-family: "Microsoft YaHei", sans-serif;
  }

  #text-container {
    height: 76px; 
    overflow-y: auto;
    white-space: pre-wrap;
  }
  #text-container::-webkit-scrollbar { display: none; }
  #text-container { -ms-overflow-style: none; scrollbar-width: none; }

  #text::after {
    content: "▌";
    color: #292524;
    animation: cursorBlink 0.8s step-end infinite;
    margin-left: 2px;
  }
  #text.done::after { content: ""; }
  @keyframes cursorBlink { 50% { opacity: 0; } }

  .dialog-footer {
    padding: 6px 12px;
    background-color: rgba(245, 245, 244, 0.8);
    border-top: 2px solid #292524;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  .tire-stripe {
    width: 60px;
    height: 6px;
    background: repeating-linear-gradient(-45deg, #292524 0, #292524 4px, transparent 4px, transparent 8px);
    border-radius: 2px;
    opacity: 0.75;
  }
  .footer-text {
    font-size: 9px;
    font-family: monospace;
    font-weight: bold;
    color: #a8a29e;
    letter-spacing: 1px;
  }

  #hint {
    position: absolute;
    right: 12px;
    bottom: -22px;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    z-index: 10;
    animation: blink 1.4s infinite;
    text-shadow: 1px 1px 3px #000;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  #choices {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0,0,0,0.6);
    z-index: 20;
  }
  #choices.show { display: flex; }
  #choices button {
    width: min(400px, 85vw);
    padding: 14px 20px;
    font-size: 15px;
    color: #292524;
    background: #FFFDF9;
    border: 2px solid #292524;
    box-shadow: 4px 4px 0px #292524;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.1s;
    font-family: inherit;
    font-weight: bold;
  }
  #choices button:hover { background: #FF7A33; color: #fff; }
  #choices button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #292524; }

  #endMark {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: 12px;
    text-shadow: 0 0 24px rgba(255, 122, 51, 0.8);
    opacity: 0;
    pointer-events: none;
    z-index: 15;
    transition: opacity 0.8s ease;
    white-space: nowrap;
  }
  #endMark.show { opacity: 1; }

  #restartBtn {
    position: fixed;
    left: 50%;
    bottom: 35vh;
    transform: translateX(-50%);
    padding: 10px 28px;
    font-size: 15px;
    color: #292524;
    background: #FF7A33;
    border: 2px solid #292524;
    border-radius: 8px;
    box-shadow: 2px 2px 0px #292524;
    cursor: pointer;
    z-index: 25;
    display: none;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
    transition: all 0.1s;
  }
  #restartBtn.show { display: block; }
  #restartBtn:active { transform: translate(-50%, 2px); box-shadow: 0px 0px 0px #292524; }
</style>
</head>
<body>

  <div id="bg"></div>
  <img id="character" class="hidden" alt="">

  <div id="dialog-wrapper">
    <div class="dialog-shadow"></div>
    
    <div id="dialog" class="dialog-box bg-pop-sage">
      <div class="dialog-top-stripe">
        <div class="stripe-1"></div>
        <div class="stripe-2"></div>
        <div class="stripe-3"></div>
      </div>

      <div class="dialog-header">
        <div class="header-left">
          <span class="pop-badge">POP-SAGE</span>
          <span id="speaker" class="speaker-name">HIGHWAY // 1979</span>
        </div>
        <div class="vinyl-icon spin-vinyl">
          <div class="vinyl-center"></div>
        </div>
      </div>

      <div class="dialog-text-area">
        <div id="text-container">
          <span id="text">点击这里开始故事……</span>
        </div>
      </div>

      <div class="dialog-footer">
        <div class="tire-stripe"></div>
        <span class="footer-text">SIDE A // STEREO</span>
      </div>
    </div>

    <div id="hint">点击继续 ▸</div>
  </div>

  <div id="choices"></div>
  <div id="endMark">— 完 —</div>
  <button id="restartBtn">重新开始</button>

<script>
/* ======================
   背景资源
   ====================== */
const BG = {
  alley: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1920&q=80",
  street: "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1920&q=80",
  convenience: "https://images.unsplash.com/photo-1601598851547-4302969d06aa?w=1920&q=80",
  bar: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=1920&q=80",
  rain: "https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=1920&q=80"
};
    /* ======================
   剧本：全部用 id 命名，杜绝索引错位
   每个节点: { id, bg, speaker, text, choices?, end? }
   选项: { text, next: "节点id" }
   ====================== */
const story = {

  /* ---------- 开场 ---------- */
  "start": { bg: BG.alley, speaker: "旁白", text: "夏夜十一点，柏油路面依然散着白日残留的焦热。巷口外的商业街霓虹闪烁，车流鸣笛与烧烤摊的划拳声混杂成一片鼎沸的声浪。一墙之隔的背街小巷里却冷清许多，只有老旧空调外机滴滴答答地漏着水，头顶的路灯接触不良，发出轻微的电流嗡鸣，把飞虫的影子拉得老长。" },
  "walk_alley": { bg: BG.alley, speaker: "旁白", text: "你顺着青苔斑驳的墙根往里走。" },
  "passerby_1": { bg: BG.alley, speaker: "路人", text: "妈的，这都什么破烂传单，塞一晚上……" },
  "passerby_2": { bg: BG.alley, speaker: "旁白", text: "巷口拐角处突然传来一阵骂骂咧咧的抱怨。一个刚下班模样的男人烦躁地抖了抖公文包，随手将捏成半团的纸片往后一扬。" },
  "fly_to_face": { bg: BG.alley, speaker: "旁白", text: "一阵带着暑气的穿堂风恰好灌进巷子，那张纸片打着旋儿飞起，不偏不倚，啪地一下糊在了你脸上。" },
  "read_flyer": { bg: BG.alley, speaker: "旁白", text: "粗糙的铜版纸带着股廉价油墨味。拿下来借着昏黄的灯光一看，纸面上印着极其夸张的荧光绿艺术字——" },
  "flyer_text": { bg: BG.alley, speaker: "传单", text: "【BugFly！重金招新！fly出你的人生！】\n【要求：会响的，好看的，能独立移动的。】" },
  "flyer_detail": { bg: BG.alley, speaker: "旁白", text: "底下印着一行小字，招聘地点是一家小酒吧，位置就在隔着两条街的旮旯里，是个平时连听都没听说过的冷门地方。" },

  /* ---------- 第一次分支 ---------- */
  "first_choice": { bg: BG.alley, speaker: "旁白", text: "你盯着那张荧光绿的传单，心里琢磨着该怎么办。", choices: [
    { text: "好奇收下，并去看看", next: "A_go_1" },
    { text: "收下，但是不去看，用来做草稿纸刚好", next: "B_keep_1" },
    { text: "直接扔掉，并且吐槽一下", next: "C_throw_1" }
  ]},

  /* ===== A线：好奇收下并去 ===== */
  "A_go_1": { bg: BG.alley, speaker: "旁白", text: "你盯着那句“会响的，好看的，能独立移动的”看了两秒，忍不住笑了一声。这算什么要求，招个挂着铃铛的扫地机器人也能达标。反正夏夜漫长，回去也是对着天花板吹空调，去见识一下这个叫“BugFly”的草台班子到底能有多离谱，倒也不失为一种消遣。" },
  "A_go_2": { bg: BG.alley, speaker: "旁白", text: "你把传单折了两折揣进裤兜，脚尖一转，顺着传单背面手绘的歪扭地图，朝着两条街外走去。" },
  "kid_howl": { bg: BG.convenience, speaker: "旁白", text: "没走出几步，前方一家二十四小时便利店的冷白灯箱下，突然炸开一阵撕心裂肺的干嚎。" },
  "kid_desc": { bg: BG.convenience, speaker: "旁白", text: "一个十三四岁模样的半大孩子正坐在马路牙子上撒泼。他身上套着件尺码大得离谱的骷髅头铆钉T恤，裤腿上挂着三四条劣质铝合金铁链，随着他蹬腿的动作哗啦乱响。头发用发胶抓成了鸡窝，额前还挑染了一撮掉色的绿毛，整个人活像一只掉进染缸后又被雷劈过的鹦鹉。" },
  "kid_yell": { bg: BG.convenience, speaker: "小孩", text: "我不去补习班！我要退学！我要搞摇滚！我要组乐队！" },
  "kid_cry": { bg: BG.convenience, speaker: "旁白", text: "小孩一把鼻涕一把泪，糊了满脸，手里还死死攥着两根鼓槌往地上砸。" },
  "mom_yell": { bg: BG.convenience, speaker: "女人", text: "摇滚？我看你是想挨滚！期中考试数学考十八分，你连五线谱上那几个豆芽菜都数不明白，还敢跟我提乐队？赶紧给我滚起来回家写卷子！" },
  "mom_slap": { bg: BG.convenience, speaker: "旁白", text: "站在他面前的女人拎着一袋刚买的挂面，气得胸口剧烈起伏，抬手就在他后脑勺上削了一巴掌。" },
  "kid_soul": { bg: BG.convenience, speaker: "小孩", text: "你根本不懂艺术！那是我的灵魂！" },
  "kid_ow": { bg: BG.convenience, speaker: "旁白", text: "小孩捂着脑袋嗷嗷乱叫。" },
  "mom_out": { bg: BG.convenience, speaker: "女人", text: "我今天就让你灵魂出窍！" },
  "mom_roll": { bg: BG.convenience, speaker: "旁白", text: "女人把挂面往地上一放，撸起袖子就要去拧他的耳朵。" },
  "second_choice": { bg: BG.convenience, speaker: "旁白", text: "你站在不远处，看着这场闹剧。", choices: [
    { text: "冷眼旁观，默默吐吐槽", next: "S_watch_1" },
    { text: "走到面前光明正大的吐槽", next: "S_mock_1" },
    { text: "帮小孩劝说", next: "S_help_1" }
  ]},

  /* ===== B线：收下不去 ===== */
  "B_keep_1": { bg: BG.alley, speaker: "旁白", text: "你把传单翻了个面。正面花里胡哨得伤眼，背面倒是完完整整的一片空白。纸质还行，挺厚实，拿铅笔写写画画应该不会洇墨，拿来做草稿纸或者垫个泡面盖子刚刚好。至于那个什么“fly出人生”的地下乐队，大概率是几个喝多了的年轻人在发疯。" },
  "B_keep_2": { bg: BG.alley, speaker: "旁白", text: "你面无表情地把传单抚平，对折塞进随身的包里，连脚步都没停一下，继续顺着冷清的巷子往住处走。" },

  /* ===== C线：扔掉 ===== */
  "C_throw_1": { bg: BG.alley, speaker: "旁白", text: "“有病吧，招人还是招大件垃圾呢。”你看着那三行莫名其妙的要求，嫌弃地啧了一声。大半夜被糊了一脸油墨味不说，还得被迫阅读这种毫无逻辑的文字垃圾，简直拉低整条街的平均智商。" },
  "C_throw_2": { bg: BG.alley, speaker: "旁白", text: "手腕一扬，那张荧光绿的传单在半空中划出一道弧线，精准地落进了旁边敞着口的绿色分类垃圾桶里，和几个空塑料瓶躺在了同一处。你拍了拍手上并不存在的灰尘，加快脚步走出了这条闷热的小巷。" },

  /* ===== 三条线汇合到便利店（共用节点） ===== */
  "conv_join_A": { bg: BG.convenience, speaker: "旁白", text: "没走出几步，前方一家二十四小时便利店的冷白灯箱下，突然炸开一阵撕心裂肺的干嚎。" },
  "conv_join_B": { bg: BG.convenience, speaker: "旁白", text: "没走出几步，前方一家二十四小时便利店的冷白灯箱下，突然炸开一阵撕心裂肺的干嚎。" },
  "conv_join_C": { bg: BG.convenience, speaker: "旁白", text: "没走出几步，前方一家二十四小时便利店的冷白灯箱下，突然炸开一阵撕心裂肺的干嚎。" },

  /* ===== 第二次分支：三种吐槽结局 ===== */
  /* --- 冷眼旁观 --- */
  "S_watch_1": { bg: BG.convenience, speaker: "旁白", text: "你脚步未停，双手插在兜里，顺着便利店门前的阴影处不紧不慢地绕了过去。路过那对母子时，目光在小孩那身五金店批发来的行头和满脸鼻涕泡上扫了一眼，随后面无表情地移开视线。" },
  "S_watch_2": { bg: BG.convenience, speaker: "旁白", text: "就这小鬼头，兜里怕是连百十块钱都掏不出，顶着一脑袋枯草和满脸青春痘，要钱没钱，要颜没颜，去台上站着是准备给观众表演胸口碎大石吗？挨这一顿削，真不冤。" },
  "S_watch_3": { bg: BG.convenience, speaker: "旁白", text: "你在心里淡淡地评价完，拐过街角，将身后杀猪般的嚎叫声彻底甩开。" },

  /* --- 光明正大吐槽 --- */
  "S_mock_1": { bg: BG.convenience, speaker: "旁白", text: "你停下脚步，直接晃到了那盏明亮的灯箱底下，居高临下地打量着地上打滚的绿毛小孩。正准备动手的妈妈愣了一下，停住动作，警惕地看向这个突然靠近的陌生人。小孩也止住了哭声，抽噎着仰起头。" },
  "S_mock_2": { bg: BG.convenience, speaker: "你", text: "小朋友，听你妈的，回去写卷子吧。你这要钱没钱，要脸没脸的？就你这条件，去了也是给舞台当背景板里的灭火器。" },
  "S_mock_3": { bg: BG.convenience, speaker: "旁白", text: "空气瞬间安静了两秒。" },
  "S_mock_4": { bg: BG.convenience, speaker: "旁白", text: "小孩的脸以肉眼可见的速度涨成了猪肝色，嘴巴张得能塞进一个鸡蛋，半天没喘上气来。" },
  "S_mock_5": { bg: BG.convenience, speaker: "小孩", text: "你谁啊！你人身攻击！妈！他骂我丑！" },
  "S_mock_6": { bg: BG.convenience, speaker: "旁白", text: "小孩爆发出比刚才还要响亮十倍的哭嚎。一旁的妈妈先是一怔，扑哧一声没憋住笑，紧接着又板起脸，一把拽起小孩的衣领。" },
  "S_mock_7": { bg: BG.convenience, speaker: "女人", text: "听见没有？连路人都看不过去了！还不赶紧走，嫌不够丢人是不是！" },
  "S_mock_8": { bg: BG.convenience, speaker: "旁白", text: "说完，冲着你略显尴尬地点了下头，拖着还在蹬腿抗议的“摇滚巨星”快步消失在了夜色里。" },

  /* --- 帮小孩劝说 --- */
  "S_help_1": { bg: BG.convenience, speaker: "旁白", text: "你叹了口气，走上前去，在女人巴掌落下来之前，弯腰捡起了地上那袋挂面，顺手递了过去。" },

/* ======================
   引擎
   ====================== */
let currentId = "start";
let typing = false;
let typeTimer = null;
let currentFullText = "";
let branchPath = "";
let locked = false;

const bgEl = document.getElementById("bg");
const charEl = document.getElementById("character");
const dialogWrapper = document.getElementById("dialog-wrapper");
const speakerEl = document.getElementById("speaker");
const textEl = document.getElementById("text");
const textContainer = document.getElementById("text-container");
const choicesEl = document.getElementById("choices");
const endMarkEl = document.getElementById("endMark");
const restartBtn = document.getElementById("restartBtn");
const hintEl = document.getElementById("hint");

function typeText(str, cb) {
  clearInterval(typeTimer);
  typing = true;
  currentFullText = str;
  textEl.textContent = "";
  textEl.classList.remove("done");
  let i = 0;
  typeTimer = setInterval(() => {
    if (i < str.length) {
      textEl.textContent += str[i];
      i++;
      textContainer.scrollTop = textContainer.scrollHeight;
    } else {
      clearInterval(typeTimer);
      typing = false;
      textEl.classList.add("done");
      if (cb) cb();
    }
  }, 30);
}

function finishTyping() {
  clearInterval(typeTimer);
  typing = false;
  textEl.textContent = currentFullText;
  textEl.classList.add("done");
  textContainer.scrollTop = textContainer.scrollHeight;
}

function showNode(id) {
  const node = story[id];
  if (!node) return;

  if (id === "A_go_1") branchPath = "A";
  if (id === "B_keep_1") branchPath = "B";
  if (id === "C_throw_1") branchPath = "C";

  currentId = id;

  bgEl.style.backgroundImage = `url('${node.bg}')`;
  speakerEl.textContent = node.speaker || "旁白";

  if (node.char && node.char !== "") {
    charEl.src = node.char;
    charEl.classList.remove("hidden");
  } else {
    charEl.classList.add("hidden");
  }

  choicesEl.classList.remove("show");
  choicesEl.innerHTML = "";
  endMarkEl.classList.remove("show");
  restartBtn.classList.remove("show");
  hintEl.style.display = "block";

  typeText(node.text, () => {
    if (node.choices) {
      setTimeout(() => showChoices(node.choices), 300);
    }
    if (node.end) {
      setTimeout(() => {
        endMarkEl.classList.add("show");
        restartBtn.classList.add("show");
        hintEl.style.display = "none";
      }, 400);
    }
  });
}

function showChoices(choices) {
  locked = true;
  choicesEl.innerHTML = "";
  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.textContent = c.text;
    btn.onclick = (e) => {
      e.stopPropagation();
      locked = false;
      choicesEl.classList.remove("show");
      choicesEl.innerHTML = "";
      showNode(c.next);
    };
    choicesEl.appendChild(btn);
  });
  choicesEl.classList.add("show");
  hintEl.style.display = "none";
}

function advance() {
  if (locked) return;

  const node = story[currentId];
  if (!node) return;

  if (typing) {
    finishTyping();
    if (node.choices) setTimeout(() => showChoices(node.choices), 100);
    if (node.end) {
      setTimeout(() => {
        endMarkEl.classList.add("show");
        restartBtn.classList.add("show");
        hintEl.style.display = "none";
      }, 200);
    }
    return;
  }

  if (choicesEl.classList.contains("show")) return;
  if (node.choices || node.end) return;

  if (node.junction) {
    if (branchPath === "A") showNode("A_rain_1");
    else if (branchPath === "B") showNode("B_rain_1");
    else if (branchPath === "C") showNode("C_rain_1");
    else showNode("A_rain_1");
    return;
  }

  const nextId = NEXT[currentId];
  if (nextId) {
    showNode(nextId);
  }
}

dialogWrapper.addEventListener("click", advance);

restartBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  clearInterval(typeTimer);
  typing = false;
  locked = false;
  branchPath = "";
  currentId = "start";
  endMarkEl.classList.remove("show");
  restartBtn.classList.remove("show");
  choicesEl.classList.remove("show");
  choicesEl.innerHTML = "";
  showNode("start");
});

showNode("start");
